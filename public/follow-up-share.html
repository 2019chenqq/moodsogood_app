<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
  <title>限時回診摘要</title>
  <style>
    body{margin:0;background:#eef8fc;color:#253746;font-family:system-ui,"Noto Sans TC",sans-serif}
    main{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 2px 12px #6aa4bd22}
    h1{font-size:24px}h2{font-size:18px;margin-top:0}.muted{color:#687b88}.error{color:#9a3030}
    ul{padding-left:1.4rem;margin-bottom:0}li{margin:8px 0;line-height:1.55}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tag{background:#e7f3f8;border-radius:999px;padding:5px 10px}
    svg{width:100%;height:220px;background:#f7fbfd;border-radius:10px;margin:4px 0 8px}
    .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
    .metric{background:#eef6fa;border-radius:10px;padding:10px 12px}
    .metric-label{font-size:12px;color:#687b88}
    .metric-value{font-weight:700;margin-top:2px}
  </style>
</head>
<body><main><h1>AI 回診摘要</h1><p id="status" class="muted">正在驗證限時分享…</p><div id="content"></div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&#38;amp;','<':'&#38;lt;','>':'&#38;gt;','"':'&#38;quot;',"'":'&#39;'}[c]));
const sentence=v=>{let s=String(v??'').trim().replace(/^[•・-]\s*/,"");if(!s)return"";return /[。！？；]+$/.test(s)?s.replace(/[。！？；]+$/,m=>m.slice(-1)):s+'。'};
const key=v=>String(v??'').trim().replace(/[\s。！？；，,.!?;]+/g,'').toLowerCase();
const sentences=values=>{const seen=new Set();return (Array.isArray(values)?values:[]).flatMap(v=>String(v??'').split(/[\r\n]+/)).map(sentence).filter(v=>v&&!seen.has(key(v))&&seen.add(key(v)))};
const isQa=v=>/(AI\s*補問|使用者(?:原始)?回答|問題[一二三四五0-9]|(^|[\s　])問[：:]|(^|[\s　])答[：:]|回答[：:])/i.test(String(v||''));
const card=(title,items,{empty='尚無資料',hide=false,plain=false}={})=>{const clean=Array.isArray(items)?items.filter(Boolean):[];if(hide&&!clean.length)return'';return `<section class="card"><h2>${esc(title)}</h2>${clean.length?(plain?clean.map(x=>`<div>${esc(x)}</div>`).join(''):`<ul>${clean.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`):`<p class="muted">${esc(empty)}</p>`}</section>`};
const med=x=>{const p=[x.date,x.medicationName].filter(Boolean).join(' '),type=String(x.type||''),bt=(x.beforeTimes||[]).join('、'),at=(x.afterTimes||[]).join('、'),u=x.afterUnit||x.beforeUnit||'',b=x.beforeDose,a=x.afterDose,withUnit=v=>v==null?'':`${v}${u?` ${u}`:''}`;let detail=type;if(type==='scheduleChanged')detail=bt&&at&&bt!==at?`服藥時間：${bt} → ${at}`:'服藥時間調整';else if(type==='added')detail=a==null?'新增':`新增，劑量 ${withUnit(a)}`;else if(type==='stopped')detail='停用';else if(['increased','decreased','doseChanged'].includes(type))detail=b!=null&&a!=null&&b!==a?`劑量調整：${withUnit(b)} → ${withUnit(a)}`:'劑量調整';return [p,detail].filter(Boolean).join('：')};
const legacySleepItems=sleep=>{const dur=sleep.durationHours||{},days=k=>Number((sleep[k]||{}).occurrenceDays||0),hours=k=>Number.isFinite(Number(dur[k]))?`${Number(dur[k]).toFixed(1)} 小時`:'無資料',base=[`有效睡眠紀錄：${Number(dur.recordedDays||0)} 天`,`平均：${hours('average')}`,`最短：${hours('minimum')}`,`最長：${hours('maximum')}`],conditions=Array.isArray(sleep.conditions)?sleep.conditions.map(x=>`${x.label||'睡眠狀況'}：${Number(x.occurrenceDays||0)} 天`):[`入睡困難：${days('sleepOnsetDifficulty')} 天`,`早醒：${days('earlyAwakening')} 天`,`夜間中斷：${days('nightInterruption')} 天`];return [...base,...conditions,`小睡：${Number((sleep.naps||{}).days||0)} 天`]};
const displayFromLegacy=s=>{const ai=s.aiOutput||{},additional=String(s.additionalNotes||'').trim(),details=String(s.discussionDetails||'').trim(),legacy=Array.isArray(ai.userReportedConcerns)?ai.userReportedConcerns:[],shared=Array.isArray(ai.userSharedNotes)&&ai.userSharedNotes.length?ai.userSharedNotes:legacy.filter(x=>key(x)===key(additional)),moved=legacy.filter(x=>key(x)!==key(additional)&&key(x)!==key(details)),rawDiscussion=Array.isArray(ai.discussionItems)&&ai.discussionItems.length?ai.discussionItems:[details,...(ai.discussionPriorities||[])],sleep=s.sleepSummary||{},meds=sentences((s.medicationTimeline||[]).map(med)),medKeys=new Set(meds.map(key));return {visitInfo:[s.appointmentDate&&`回診日期：${String(s.appointmentDate).slice(0,10).replaceAll('-','/')}`,`統計期間：${String(s.periodStart||'').slice(0,10).replaceAll('-','/')}～${String(s.periodEnd||'').slice(0,10).replaceAll('-','/')}`,`有效紀錄天數：${s.validRecordDays||0} 天`].filter(Boolean),topicLabels:(s.selectedTopics||[]).map(x=>x.label).filter(Boolean),discussionItems:sentences(rawDiscussion).filter(x=>!isQa(x)).slice(0,5),keyChanges:sentences([...(ai.keyChanges||[]),...moved]).filter(x=>!isQa(x)&&!medKeys.has(key(x))).slice(0,5),timelineRelations:[],symptoms:[],bodyMeasurements:[],userSharedNotes:sentences([additional,...shared]).filter(x=>!isQa(x)),sleepSummaryItems:legacySleepItems(sleep),sleepTrend:s.sleepTrend||[],medicationTimeline:meds,dataLimitations:sentences(ai.dataLimitations).filter(x=>!isQa(x)),generatedAt:String(ai.generatedAt||'').slice(0,16).replace('T',' '),disclaimer:'摘要僅供回診溝通參考，不取代醫師判斷。'} };
const sleepMetricCards=items=>{const clean=(Array.isArray(items)?items:[]).filter(Boolean);if(!clean.length)return'';const metrics=clean.map(item=>{const [label,...rest]=String(item).split('：');return {label:label||'',value:rest.join('：')||item};});return `<div class="metrics">${metrics.map(x=>`<div class="metric"><div class="metric-label">${esc(x.label)}</div><div class="metric-value">${esc(x.value)}</div></div>`).join('')}</div>`};
const chart=trend=>{const samples=(Array.isArray(trend)?trend:[]).map(x=>({value:Number(x.value),date:String(x.date||'').slice(5,10)})).filter(x=>Number.isFinite(x.value));if(!samples.length)return'<p class="muted">統計期間內沒有可用的睡眠時數紀錄。</p>';const values=samples.map(x=>x.value),dataMin=Math.min(...values),dataMax=Math.max(...values),min=Math.max(0,Math.floor(dataMin-1)),max=Math.max(min+1,Math.ceil(dataMax+1)),width=600,height=220,left=56,right=12,top=14,bottom=34,plotW=width-left-right,plotH=height-top-bottom,range=max-min;const xy=(i,v)=>{const x=samples.length===1?left+plotW/2:left+i*plotW/(samples.length-1),y=top+(max-v)/range*plotH;return [x,y]};const pts=samples.map((s,i)=>xy(i,s.value)),line=pts.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' ');let yTicks='';for(let i=0;i<=4;i++){const y=top+i/4*plotH,val=max-(range*i/4),label=(Math.round(val*10)/10).toString().replace(/\.0$/,'');yTicks+=`<line x1="${left}" y1="${y.toFixed(1)}" x2="${(width-right).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#d9e6ed"/><text x="${(left-8).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#6a7e8d">${esc(label)}</text>`;}let xTicks='';const step=samples.length<=4?1:Math.ceil(samples.length/4);for(let i=0;i<samples.length;i+=step){const [x]=xy(i,samples[i].value);xTicks+=`<text x="${x.toFixed(1)}" y="${(height-10).toFixed(1)}" text-anchor="middle" font-size="9" fill="#6a7e8d">${esc(samples[i].date)}</text>`;}if((samples.length-1)%step!==0){const last=samples[samples.length-1];xTicks+=`<text x="${(width-right).toFixed(1)}" y="${(height-10).toFixed(1)}" text-anchor="end" font-size="9" fill="#6a7e8d">${esc(last.date)}</text>`;}const dots=pts.map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#4e6aa5"/>`).join('');return `<svg viewBox="0 0 600 220" role="img" aria-label="每日睡眠時數折線圖"><line x1="${left}" y1="${top}" x2="${left}" y2="${(height-bottom).toFixed(1)}" stroke="#afc4d1"/><line x1="${left}" y1="${(height-bottom).toFixed(1)}" x2="${(width-right).toFixed(1)}" y2="${(height-bottom).toFixed(1)}" stroke="#afc4d1"/>${yTicks}${xTicks}<polyline points="${line}" fill="none" stroke="#63a8c7" stroke-width="3"/>${dots}</svg>`};
const discussion=d=>`<section class="card"><h2>想跟醫師討論的事</h2>${d.topicLabels?.length?`<div class="tags">${d.topicLabels.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:''}${d.discussionItems?.length?`<ul>${d.discussionItems.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:(!d.topicLabels?.length?'<p class="muted">尚無資料</p>':'')}</section>`;
(async()=>{const token=new URLSearchParams(location.search).get('token');try{if(!token)throw Error();const r=await fetch(`/api/follow-up-summary-share?token=${encodeURIComponent(token)}`,{cache:'no-store'});if(!r.ok)throw Error();const body=await r.json(),s=body.summary||{},d=s.display||displayFromLegacy(s),included=new Set(Array.isArray(d.includedSections)?d.includedSections:['discussion','sleep','emotionsAndSymptoms','medicationAdjustments','lifeUpdates','dataLimitations','bodyMeasurements']);document.getElementById('status').textContent=`分享有效期限：${new Date(body.expiresAt).toLocaleString('zh-TW')}`;document.getElementById('content').innerHTML=card('基本資訊',d.visitInfo,{plain:true})+(included.has('discussion')?discussion(d):'')+(included.has('emotionsAndSymptoms')?card('主要變化',d.keyChanges):'')+(included.has('sleep')?`<section class="card"><h2>睡眠趨勢</h2>${chart(d.sleepTrend)}${sleepMetricCards(d.sleepSummaryItems)}</section>`:'')+(included.has('emotionsAndSymptoms')?card('身體症狀',d.symptoms,{empty:'此摘要沒有可顯示的症狀資料'}):'')+(included.has('bodyMeasurements')?card('身體測量',d.bodyMeasurements,{empty:'此摘要沒有可顯示的體重、體脂率或腰圍資料'}):'')+(included.has('medicationAdjustments')?card('藥物調整時間軸',d.medicationTimeline,{empty:'此摘要沒有藥物調整紀錄'}):'')+(included.has('lifeUpdates')?card('其他想跟醫師說的內容',d.userSharedNotes,{empty:'沒有其他想跟醫師說的內容'}):'')+(included.has('dataLimitations')?card('資料限制',d.dataLimitations):'')+card('AI 整理時間',[d.generatedAt],{plain:true})+`<p class="muted">${esc(d.disclaimer||'摘要僅供回診溝通參考，不取代醫師判斷。')}</p>`;}catch(_){document.getElementById('status').innerHTML='<span class="error">此分享不存在、已過期或已停止。</span>';}})();
</script></body></html>
