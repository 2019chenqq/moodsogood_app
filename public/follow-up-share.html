<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
  <title>限時回診摘要</title>
  <style>
    body{margin:0;background:#eef8fc;color:#253746;font-family:system-ui,"Noto Sans TC",sans-serif}
    main{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 2px 12px #6aa4bd22}
    h1{font-size:24px}h2{font-size:18px;margin-top:0}.muted{color:#687b88}.error{color:#9a3030}
    ul{padding-left:1.4rem;margin-bottom:0}li{margin:8px 0;line-height:1.55;white-space:pre-wrap}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tag{background:#e7f3f8;border-radius:999px;padding:5px 10px}
    svg{width:100%;height:auto;aspect-ratio:600/220;background:#f7fbfd;border-radius:10px;margin:4px 0 8px}
  </style>
</head>
<body><main><h1>AI 回診摘要</h1><p id="status" class="muted">正在驗證限時分享…</p><div id="content"></div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sentence=v=>{let s=String(v??'').trim().replace(/^[•・-]\s*/,"");if(!s)return"";return /[。！？；]+$/.test(s)?s.replace(/[。！？；]+$/,m=>m.slice(-1)):s+'。'};
const key=v=>String(v??'').trim().replace(/[\s。！？；，,.!?;]+/g,'').toLowerCase();
const sentences=values=>{const seen=new Set();return (Array.isArray(values)?values:[]).flatMap(v=>String(v??'').split(/[\r\n]+/)).map(sentence).filter(v=>v&&!seen.has(key(v))&&seen.add(key(v)))};
const card=(title,items,{empty='尚無資料',hide=false,plain=false}={})=>{const clean=Array.isArray(items)?items.filter(Boolean):[];if(hide&&!clean.length)return'';return `<section class="card"><h2>${esc(title)}</h2>${clean.length?(plain?clean.map(x=>`<div>${esc(x)}</div>`).join(''):`<ul>${clean.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`):`<p class="muted">${esc(empty)}</p>`}</section>`};
const med=x=>{const p=[x.date,x.medicationName].filter(Boolean).join(' '),type=String(x.type||''),bt=(x.beforeTimes||[]).join('、'),at=(x.afterTimes||[]).join('、'),u=x.afterUnit||x.beforeUnit||'',b=x.beforeDose,a=x.afterDose,withUnit=v=>v==null?'':`${v}${u?` ${u}`:''}`;let detail=type;if(type==='scheduleChanged')detail=bt&&at&&bt!==at?`服藥時間：${bt} → ${at}`:'服藥時間調整';else if(type==='added')detail=a==null?'新增':`新增，劑量 ${withUnit(a)}`;else if(type==='stopped')detail='停用';else if(['increased','decreased','doseChanged'].includes(type))detail=b!=null&&a!=null&&b!==a?`劑量調整：${withUnit(b)} → ${withUnit(a)}`:'劑量調整';return [p,detail].filter(Boolean).join('：')};
const displayFromLegacy=s=>{const ai=s.aiOutput||{},additional=String(s.additionalNotes||'').trim(),details=String(s.discussionDetails||'').trim(),legacy=Array.isArray(ai.userReportedConcerns)?ai.userReportedConcerns:[],shared=Array.isArray(ai.userSharedNotes)&&ai.userSharedNotes.length?ai.userSharedNotes:legacy.filter(x=>key(x)===key(additional)),moved=legacy.filter(x=>key(x)!==key(additional)&&key(x)!==key(details)),sleep=s.sleepSummary||{},dur=sleep.durationHours||{},days=k=>Number((sleep[k]||{}).occurrenceDays||0),hours=k=>Number.isFinite(Number(dur[k]))?`${Number(dur[k]).toFixed(1)} 小時`:'無資料';return {visitInfo:[s.appointmentDate&&`回診日期：${String(s.appointmentDate).slice(0,10).replaceAll('-','/')}`,`統計期間：${String(s.periodStart||'').slice(0,10).replaceAll('-','/')}～${String(s.periodEnd||'').slice(0,10).replaceAll('-','/')}`,`有效紀錄天數：${s.validRecordDays||0} 天`].filter(Boolean),topicLabels:(s.selectedTopics||[]).map(x=>x.label).filter(Boolean),discussionItems:sentences([details,...(ai.discussionPriorities||[])]),keyChanges:sentences([...(ai.keyChanges||[]),...moved]),recordEvidenceHighlights:sentences(ai.recordEvidenceHighlights),timelineRelations:sentences(ai.timelineRelations),userSharedNotes:sentences([additional,...shared]),sleepSummaryItems:[`有效睡眠紀錄：${Number(dur.recordedDays||0)} 天`,`平均：${hours('average')}`,`最短：${hours('minimum')}`,`最長：${hours('maximum')}`,`入睡困難：${days('sleepOnsetDifficulty')} 天`,`早醒：${days('earlyAwakening')} 天`,`夜間中斷：${days('nightInterruption')} 天`,`小睡：${Number((sleep.naps||{}).days||0)} 天`],sleepTrend:s.sleepTrend||[],medicationTimeline:sentences((s.medicationTimeline||[]).map(med)),medicationSubjectiveSummaries:sentences(ai.medicationSubjectiveSummaries),dataLimitations:sentences(ai.dataLimitations),generatedAt:String(ai.generatedAt||'').slice(0,16).replace('T',' '),disclaimer:'摘要僅供回診溝通參考，不取代醫師判斷。'} };
const chart=trend=>{const data=(Array.isArray(trend)?trend:[]).map(x=>({value:Number(x.value),date:String(x.date||'').slice(5,10)})).filter(x=>Number.isFinite(x.value));if(!data.length)return'<p class="muted">統計期間內沒有可用的睡眠時數紀錄。</p>';const values=data.map(x=>x.value),dataMin=Math.min(...values),dataMax=Math.max(...values),min=Math.max(0,Math.min(24,Math.floor(dataMin-1))),max=Math.max(min+1,Math.min(24,Math.ceil(dataMax+1))),left=56,right=12,top=14,bottom=34,width=600,height=220,plotWidth=width-left-right,plotHeight=height-top-bottom,yRange=Math.max(1,Math.min(24,max-min)),x=i=>data.length===1?left+plotWidth/2:left+i*plotWidth/(data.length-1),y=v=>top+(max-v)/yRange*plotHeight,pts=data.map((p,i)=>`${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' '),ticks=[0,1,2,3,4],step=data.length<=4?1:Math.ceil(data.length/4),xIndexes=[];for(let i=0;i<data.length;i+=step)xIndexes.push(i);if(!xIndexes.includes(data.length-1))xIndexes.push(data.length-1);return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-label="每日睡眠時數折線圖"><rect width="600" height="220" fill="#F7FBFD"/><line x1="${left}" y1="${top}" x2="${left}" y2="${height-bottom}" stroke="#AFC4D1"/><line x1="${left}" y1="${height-bottom}" x2="${width-right}" y2="${height-bottom}" stroke="#AFC4D1"/>${ticks.map(t=>{const value=min+yRange*(4-t)/4,ty=top+t/4*plotHeight,label=Number.isInteger(value)?value:value.toFixed(1);return `<line x1="${left}" y1="${ty.toFixed(1)}" x2="${width-right}" y2="${ty.toFixed(1)}" stroke="#D9E6ED"/><text x="${left-8}" y="${(ty+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#6A7E8D">${label}</text>`}).join('')}${xIndexes.map((i,index)=>`<text x="${x(i).toFixed(1)}" y="${height-10}" text-anchor="${index===xIndexes.length-1&&i===data.length-1?'end':'middle'}" font-size="9" fill="#6A7E8D">${esc(data[i].date)}</text>`).join('')}<polyline points="${pts}" fill="none" stroke="#63A8C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${data.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3.5" fill="#4E6AA5"><title>${esc(p.date)}：${p.value} 小時</title></circle>`).join('')}</svg>`};
const discussion=d=>`<section class="card"><h2>想跟醫師討論的事</h2>${d.topicLabels?.length?`<div class="tags">${d.topicLabels.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:''}${d.discussionItems?.length?`<ul>${d.discussionItems.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:(!d.topicLabels?.length?'<p class="muted">尚無資料</p>':'')}</section>`;
(async()=>{const token=new URLSearchParams(location.search).get('token');try{if(!token)throw Error();const r=await fetch(`/api/follow-up-summary-share?token=${encodeURIComponent(token)}`,{cache:'no-store'});if(!r.ok)throw Error();const body=await r.json(),s=body.summary||{},d=s.display||displayFromLegacy(s),included=new Set(Array.isArray(d.includedSections)?d.includedSections:['discussion','sleep','emotionsAndSymptoms','medicationAdjustments','lifeUpdates','dataLimitations']);document.getElementById('status').textContent=`分享有效期限：${new Date(body.expiresAt).toLocaleString('zh-TW')}`;document.getElementById('content').innerHTML=card('基本資訊',d.visitInfo,{plain:true})+(included.has('discussion')&&(d.discussionItems?.length||d.topicLabels?.length)?discussion(d):'')+(included.has('emotionsAndSymptoms')?card('主要變化',d.keyChanges,{hide:true}):'')+(included.has('sleep')&&(d.sleepTrend?.length||d.sleepSummaryItems?.length)?`<section class="card"><h2>睡眠趨勢</h2>${chart(d.sleepTrend)}${d.sleepSummaryItems?.length?`<ul>${d.sleepSummaryItems.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</section>`:'')+(included.has('emotionsAndSymptoms')?card('症狀與情緒共現模式',d.symptoms,{hide:true}):'')+(included.has('bodyMeasurements')?card('身體測量',d.bodyMeasurements,{hide:true}):'')+(included.has('medicationAdjustments')?card('藥物調整時間軸',d.medicationTimeline,{hide:true}):'')+(included.has('lifeUpdates')?card('其他想跟醫師說的內容',d.userSharedNotes,{hide:true}):'')+(included.has('dataLimitations')?card('資料限制',d.dataLimitations,{hide:true}):'')+`<p class="muted">${esc(d.disclaimer||'摘要僅供回診溝通參考，不取代醫師判斷。')}</p>`;}catch(_){document.getElementById('status').innerHTML='<span class="error">此分享不存在、已過期或已停止。</span>';}})();
</script></body></html>
